// SLAM
//
// The SLAM's (simultaneous localization and mapping) state, poses, map and
// sensors: what its telemetry (Slam*Tel in telemetry.proto) and its requests
// (in req_rep.proto) carry.
//
// The SLAM has its own publisher, not the drone's telemetry socket: a client
// subscribes to it on the drone at TCP port 5561 (WebSocket 9989) to get the
// Slam*Tel messages. Its requests (GetSlamMapReq, ResetSlamReq,
// SetSlamActiveReq, SetSlamSensorSettingsReq, SetSlamRecordingReq,
// SetSlamBaseMapReq) go to the drone's request server as other requests do,
// which forwards them to the SLAM's (TCP 5562, WebSocket 9990).
//
// These messages change only by addition: new fields, messages, enum values and
// oneof members, never a field renumbered, retyped or given another meaning (CI
// checks the numbers and types, ci-buf.yaml). A client ignores what it does not
// know: an enum value as UNSPECIFIED, a oneof set to a member it does not know as
// unset (a submap with such content keeps its id and anchor and shows nothing),
// and fields it does not know. Packed bytes (PointCloud, SlamKeyframePoses) keep
// their layout: more data per point or per pose comes in a field of its own, with
// the same count.
syntax = "proto3";

package blueye.protocol;
import "google/protobuf/timestamp.proto";
import "message_formats.proto";
option csharp_namespace = "Blueye.Protocol.Protobuf";
option java_multiple_files = true;

// State of the SLAM (simultaneous localization and mapping).
enum SlamState {
  SLAM_STATE_UNSPECIFIED = 0; // Unspecified.
  SLAM_STATE_WAITING = 1; // Waiting for the first scan and orientation.
  SLAM_STATE_TRACKING = 2; // The latest scan was matched against the map.
  SLAM_STATE_COASTING = 3; // The latest scan could not be matched; the pose follows the motion model.
  // Coasting long enough that the prediction may be far off: a scan is placed again only by a match
  // that fixes the pose firmly.
  SLAM_STATE_LOST = 4;
}

// Kind of sensor a SLAM scan comes from.
enum SlamSensorType {
  SLAM_SENSOR_TYPE_UNSPECIFIED = 0; // Unspecified.
  SLAM_SENSOR_TYPE_SONAR_3D = 1; // A 3D imaging sonar, e.g. the Water Linked Sonar 3D-15.
  SLAM_SENSOR_TYPE_STEREO_CAMERA = 2; // A stereo camera's depth.
  // A 2D imaging sonar (multibeam), e.g. the Oculus M750D: range and bearing, no elevation.
  SLAM_SENSOR_TYPE_MULTIBEAM_2D = 3;
}

// What the SLAM's poses are the poses of: its platform.
enum SlamPlatform {
  SLAM_PLATFORM_UNSPECIFIED = 0; // Not known.
  // The drone, its body frame x forward, y right, z down from the middle of the hull. Each
  // sensor is on it through its mount (SlamPose mount in the messages that carry one).
  SLAM_PLATFORM_DRONE = 1;
  // The sensor itself: the SLAM did not know how the sensor is mounted.
  SLAM_PLATFORM_SENSOR = 2;
}

// A sensor whose scans feed the SLAM, and its field of view.
message SlamSensor {
  // Sensor id, unique among the SLAM's sensors. A sensor keeps the id it was given for as long as it
  // is connected, whatever other sensors connect or disconnect: the model's (e.g.
  // "waterlinked-sonar-3d15") when no other sensor of that model is connected, and else the model's with
  // the guest port the sensor is on added (e.g. "waterlinked-sonar-3d15-gp2").
  string id = 1;
  SlamSensorType sensor_type = 2; // Kind of sensor.
  float fov_horizontal = 3; // Horizontal field of view, about the sensor's z axis (°).
  float fov_vertical = 4; // Vertical field of view, about the sensor's y axis (°).
  float max_range = 5; // Range the sensor is set to (m).
  // The sensor as a guest port device (e.g. GUEST_PORT_DEVICE_ID_WATERLINKED_SONAR_3D15), for a client
  // to show the device itself; GUEST_PORT_DEVICE_ID_UNSPECIFIED when it is not one (a simulated sensor).
  GuestPortDeviceID device_id = 6;
  bool simulated = 7; // True if the sensor is simulated (its scans are made up, for testing).
}

// A recording of the SLAM, as the SLAM reports it.
//
// A recording is a .sbez file (a binlog) with the SLAM's output: the map at its
// start, then the poses, the map updates and the status. It may hold several maps
// (a reset, or a new mode, starts one), and each map it holds ends with the whole
// map (SlamMapTel, in parts when it is large). With sensor data it also has the
// sensor's raw data beside it (for a 3D sonar a .sonar file), and the drone's dive
// log logs its telemetry at higher rates while it runs, so the SLAM can be run
// again on both without the drone.
message SlamRecordingState {
  bool is_recording = 1; // True while recording.
  string name = 2; // File name of the .sbez, without its folder.
  int32 seconds = 3; // Time recorded (s).
  uint64 size = 4; // Size of the recording's files so far (bytes).
  bool sensor_data = 5; // True if the sensor's raw data is recorded too.
  StorageLocation storage_location = 6; // Where the recording is stored.
}

// SONAR_3D reads better than protolint's SONAR3D for Sonar3d.
// protolint:disable ENUM_FIELD_NAMES_PREFIX

// Frequency mode of a 3D imaging sonar.
enum Sonar3dFrequencyMode {
  SONAR_3D_FREQUENCY_MODE_UNSPECIFIED = 0; // Unspecified: left as it is.
  SONAR_3D_FREQUENCY_MODE_LOW = 1; // Wide view, long range (3D-15: 90° x 40°, 15 m, 5 scans/s).
  SONAR_3D_FREQUENCY_MODE_HIGH = 2; // Narrow view, short range, fine detail (3D-15: 40° x 40°, 4 m, 20 scans/s).
}

// protolint:enable ENUM_FIELD_NAMES_PREFIX

// Settings of a 3D imaging sonar that feeds the SLAM.
//
// In a request, unspecified or 0 leaves a setting as it is; in a report, it
// means the sonar does not say (e.g. a firmware without frequency modes).
message SlamSonar3dSettings {
  Sonar3dFrequencyMode frequency_mode = 1; // Frequency mode.
  float max_range = 2; // Maximum range (m).
}

// How the SLAM places the returns of a 2D multibeam sonar, which have a range
// and a bearing but no elevation.
enum SlamMultibeamMode {
  SLAM_MULTIBEAM_MODE_UNSPECIFIED = 0; // Unspecified: left as it is.
  // By the sonar's tilt: on the seabed when it looks down, in a level plane through it when it is near level.
  SLAM_MULTIBEAM_MODE_AUTO = 1;
  SLAM_MULTIBEAM_MODE_SEABED = 2; // On a flat seabed, at the drone's altitude above it (seabed surveys).
  // In a level plane through the sonar, each return at its range, as on walls, piles and nets (the sonar near level).
  SLAM_MULTIBEAM_MODE_STRUCTURE = 3;
}

// Settings of a 2D multibeam sonar that feeds the SLAM.
//
// The sonar's own settings (range, gain, frequency, ping rate) belong to the
// multibeam page: the SLAM reads the sonar's images and follows those settings
// without changing them. In a request, unspecified leaves a setting as it is; in
// a report, the mode is as set (AUTO, not the one it chose).
message SlamMultibeamSettings {
  SlamMultibeamMode mode = 1; // How the returns are placed.
  // The mosaic's resolution (m a pixel). 0: from the sonar's range, the resolution the pings are matched at.
  // It applies to the mosaic's tiles begun after the change; one finer than finest_mosaic_resolution takes that.
  // A tile may be finer where its pings' range is short and coarser where it is long: each raster has its own.
  optional float mosaic_resolution = 2;
  // In a report, the finest mosaic_resolution the SLAM takes (m a pixel), as its computer allows; a tile of a
  // short range may still be finer (SlamRaster.resolution).
  optional float finest_mosaic_resolution = 3;
}

// Settings of a sensor that feeds the SLAM.
//
// One message for each kind of sensor, so a client shows the settings of the
// sensors the SLAM has, and a sensor takes only its own.
message SlamSensorSettings {
  oneof settings {
    SlamSonar3dSettings sonar_3d = 1; // A 3D imaging sonar's settings.
    SlamMultibeamSettings multibeam = 2; // A 2D multibeam sonar's settings.
  }
}

// A sensor that feeds the SLAM, as the SLAM reports it.
message SlamSensorStatus {
  // The sensor, as its latest scan described it (before its first scan, its id and type only).
  SlamSensor sensor = 1;
  SlamSensorSettings settings = 2; // The sensor's settings, unset when it has none or they cannot be read.
  // The sensor's pose on the platform now: its mount, at the mount's tilt now. Unset when the
  // platform is the sensor.
  SlamPose mount = 3;
  optional float mount_tilt = 4; // Tilt of the sensor's mount (°, positive up), for a mount that tilts.
}

// A pose: of a body in the SLAM map frame, or of a sensor on the platform.
//
// The map frame is fixed where the map was started (see SlamMapFrame): z down, x
// along the heading the map started with (north when a compass heading was used),
// y to the right of it, in metres. The body is the one the field names (the
// platform, or a sensor), its frame x forward, y right, z down. A mount is a
// sensor's pose in the platform's frame instead: the sensor is in the map at the
// platform's pose times its mount. A raster's origin is its pose in the frame the
// enclosing message names (see SlamRaster).
message SlamPose {
  Vector3 position = 1; // Position of the body (m).
  Quaternion orientation = 2; // Rotation from the body's frame to the frame it is placed in.
}

// The SLAM estimate of its platform's pose, published for every scan.
message SlamPoseEstimate {
  uint32 map_id = 1; // Identifier of the map; a new one is chosen whenever the map restarts.
  SlamState state = 2; // State of the SLAM.
  SlamPose pose = 3; // Pose of the platform (SlamMapFrame.platform) at the scan.
  google.protobuf.Timestamp time = 4; // Host time the scan was received.
  uint32 scan_points = 5; // Points (or cells) of the scan used for matching.
  float match_inlier_ratio = 6; // Share of those matched to the map (0..1).
  // Root mean square residual of the matched points against the map (m); for a 3D sonar, their distance to the
  // map's planes. 0 when the matcher has none (a 2D multibeam matches images).
  float match_rms = 7;
  uint32 keyframe_count = 8; // Keyframes in the map.
  uint32 map_point_count = 9; // Points (or cells) in the map.
  // Depth used for the scan (m), when there was one: the sensor's, from the drone's depth sensor
  // through the mount (without a mount, the depth sensor's own).
  optional float depth = 10;
  string sensor_id = 11; // Sensor whose scan was placed (SlamSensor.id).
  // The sensor's pose on the platform at the scan: the sensor was at pose times mount.
  // Unset when the platform is the sensor.
  SlamPose mount = 12;
  // Covariance of pose as the scan's match placed it against the map, given the
  // prediction: 6 x 6, row by row, of a rotation about the map's x, y and z axes
  // (rad) and then a position along them (m). It says how well this scan fixed the
  // pose, not how far the map has drifted. Empty when the match gave none: the scan was not matched,
  // the map's first scan (nothing to match it against), or a fit whose covariance was not finite.
  repeated float covariance_elements = 13;
  // The newest keyframe when the scan was placed (SlamKeyframe.id), 0 before the map's first. A client
  // keeping poses can move one with that keyframe when a loop closure moves it: the pose becomes the
  // keyframe's new pose times its pose then, inverted, times the pose.
  uint32 keyframe_id = 14;
}

// A keyframe: a scan kept in the map, the nodes of the SLAM trajectory.
message SlamKeyframe {
  uint32 id = 1; // Keyframe id, increasing along the trajectory.
  uint32 submap_id = 2; // Submap whose content the keyframe added to.
  // Pose of the platform at the keyframe. It moves when the trajectory is corrected.
  SlamPose pose = 3;
  google.protobuf.Timestamp time = 4; // Host time the keyframe's scan was received.
  string sensor_id = 5; // Sensor whose scan the keyframe is (SlamSensor.id).
  // The sensor's pose on the platform at the keyframe. Unset when the platform is the sensor.
  SlamPose mount = 6;
}

// How a raster's pixels are stored.
enum SlamRasterFormat {
  SLAM_RASTER_FORMAT_UNSPECIFIED = 0; // Unspecified.
  SLAM_RASTER_FORMAT_UINT8 = 1; // One byte a pixel, 0 to 255.
}

// What a raster's pixels measure.
enum SlamRasterValue {
  SLAM_RASTER_VALUE_UNSPECIFIED = 0; // Unspecified.
  // Echo strength (a sonar mosaic), on one relative scale for all of a sensor's rasters: higher is stronger.
  SLAM_RASTER_VALUE_ECHO = 1;
}

// A raster: an image laid on a plane, such as a 2D imaging sonar's mosaic of what
// it saw around a submap.
//
// The raster has a frame of its own, which origin places in the frame the
// enclosing message names: in a SlamSubmap, the platform's frame at its anchor
// keyframe, so the raster is in the map at the anchor's pose times its origin. It
// lies on the plane z = 0 of its frame, with the corner of row 0 and column 0 at
// the origin: row r and column c cover x from r * resolution and y from
// c * resolution, each over one resolution.
//
// pixels holds exactly rows * columns pixels as pixel_format stores them, and
// coverage is empty or exactly rows * columns bytes. They may come deflated
// instead (pixels_deflated, coverage_deflated), with pixels and coverage empty:
// inflated, they hold what pixels and coverage would. A raster that disagrees, whose
// resolution is not positive or origin is unset, or whose pixel_format or value the
// client does not know, is not used: the submap keeps the raster it had. A change
// to how pixels are placed or read comes as a new pixel_format, a new kind of
// content, or new fields that leave pixels empty, never as a field old clients
// would ignore while they read pixels.
message SlamRaster {
  SlamPose origin = 1; // The raster's frame, in the frame the enclosing message names.
  uint32 rows = 2; // Rows: the raster spans rows * resolution along its x.
  uint32 columns = 3; // Columns: the raster spans columns * resolution along its y.
  // Size of a pixel, along x and along y (m). Rasters of one map may differ in it: a multibeam's submaps are
  // painted as finely as their sonar's range calls for.
  float resolution = 4;
  SlamRasterFormat pixel_format = 5; // How the pixels are stored.
  SlamRasterValue value = 6; // What the pixels measure.
  bytes pixels = 7; // rows * columns pixels, row by row, each as pixel_format stores it.
  // rows * columns bytes, row by row: how well each pixel was seen, from 0 (not seen: the pixel
  // holds nothing) to 255, for weighing rasters where they overlap. Empty, and coverage_deflated
  // empty too: every pixel seen fully, as 255.
  bytes coverage = 8;
  // pixels compressed with zlib (deflate in a zlib stream, RFC 1950), in place of pixels, which is then
  // empty: a fraction of the bytes over the link. A client that does not know it sees no pixels, and keeps
  // the raster it had.
  bytes pixels_deflated = 9;
  // coverage compressed the same way, in place of coverage, which is then empty. Only with
  // pixels_deflated, so that a client that knows neither never takes the coverage for full.
  bytes coverage_deflated = 10;
}

// A submap: part of the map from one sensor, in the platform's frame at its anchor
// keyframe.
//
// A submap moves rigidly with its anchor keyframe, so a correction of the
// trajectory moves its content without sending it again. A submap holds one kind
// of content: points, or a raster (e.g. a 2D sonar's mosaic). Each kind says how
// a later one replaces what the submap holds.
message SlamSubmap {
  uint32 submap_id = 1; // Submap id.
  uint32 anchor_keyframe_id = 2; // Keyframe whose platform frame the content is in.
  string sensor_id = 3; // Sensor the content comes from (SlamSensor.id).
  oneof content {
    // Points in the platform's frame at the anchor keyframe. In a map update they are appended to the
    // submap's points, unless replace is set.
    PointCloud points = 4;
    // A raster placed in the platform's frame at the anchor keyframe (SlamRaster.origin). It is sent
    // whole, and replaces the submap's raster so far: as the submap grows, its raster is sent again.
    SlamRaster raster = 6;
  }
  bool replace = 5; // Points: true if they replace the submap's points so far, rather than adding to them.
}

// Poses of consecutive keyframes, packed: what a correction of the trajectory
// moved, sent without the rest of each keyframe.
message SlamKeyframePoses {
  uint32 first_keyframe_id = 1; // Keyframe id of the first pose; the others follow it in id order.
  // Platform poses as in SlamKeyframe.pose, 7 little-endian float32 each: x, y, z (m), then the
  // orientation's x, y, z, w. 28 bytes per keyframe.
  bytes poses = 2;
}

// A loop closure: a keyframe's scan matched to the map where the trajectory had
// been before, which corrected the trajectory. The keyframes the correction moved
// come in the same update, so a client that held the map before has the
// trajectory as it was.
message SlamLoopClosure {
  uint32 keyframe_id = 1; // Keyframe whose scan closed the loop.
  uint32 matched_keyframe_id = 2; // Earlier keyframe it was matched near.
  // How far the correction moved the newest keyframe it reached (m): the loop's keyframe, or one
  // added while the loop was being closed.
  float position_correction = 3;
  // How far it turned that keyframe about the map's z axis (°, positive clockwise seen from
  // above in a gravity-aligned map).
  float heading_correction = 4;
}

// A change to the SLAM map.
//
// Updates are numbered: a client that has the map at sequence N applies the
// update with sequence N + 1 next. When it misses one, or the map id changes, it
// asks to catch up (GetSlamMapReq): it gets the updates it missed again, or the
// whole map.
message SlamMapUpdate {
  uint32 map_id = 1; // Identifier of the map.
  uint64 sequence = 2; // Sequence number of this update, from 1.
  repeated SlamKeyframe keyframes = 3; // Keyframes added.
  // Content added to submaps, or replacing a submap's: points with SlamSubmap.replace set, and rasters.
  repeated SlamSubmap submaps = 4;
  // The map's frame, on the update that adds the first keyframe and on any that
  // learns more of it: a recording cut short has it without its last SlamMapTel.
  SlamMapFrame frame = 5;
  repeated SlamLoopClosure loop_closures = 6; // Loop closures whose correction moved the keyframes.
  repeated SlamKeyframePoses moved_poses = 7; // New poses of the keyframes a correction moved, in runs.
  repeated uint32 removed_submap_ids = 8; // Submaps taken out of the map, with whatever they hold.
}

// Why the SLAM did not do what a request asked (the reply says what it did do).
enum SlamRequestError {
  SLAM_REQUEST_ERROR_UNSPECIFIED = 0; // None: the request was done, or asked for what already was.
  SLAM_REQUEST_ERROR_NOT_READABLE = 1; // The request could not be read.
  SLAM_REQUEST_ERROR_OTHER_MAP = 2; // The request named a map that is not the current one.
  // The request named a sensor the SLAM does not have, or named none where it has several that fit.
  SLAM_REQUEST_ERROR_NO_SUCH_SENSOR = 3;
  SLAM_REQUEST_ERROR_SENSOR = 4; // The sensor did not take it (it did not answer, or refused).
  SLAM_REQUEST_ERROR_BUSY = 5; // Another change to the sensor is under way; ask again after it.
  SLAM_REQUEST_ERROR_NOT_MAPPING = 6; // It needs the SLAM to be mapping (a recording).
  SLAM_REQUEST_ERROR_STORAGE = 7; // No storage to record to, or it is full.
  SLAM_REQUEST_ERROR_NOT_SUPPORTED = 8; // The SLAM or its sensor cannot do it.
  SLAM_REQUEST_ERROR_NO_BASE_MAP = 9; // It needs a base map, and none is loaded.
  // The base map named cannot be loaded. For a name that is not a bare file name (.sbez), or a file that is not
  // there, the reply has this error at once, and the base map before stays. A file that holds no map the SLAM can
  // localize in ends its load FAILED, with this error in SlamBaseMapState.error.
  SLAM_REQUEST_ERROR_BASE_MAP_UNREADABLE = 10;
  SLAM_REQUEST_ERROR_OTHER_BASE_MAP = 11; // The request named a load of a base map that is not the current one.
  SLAM_REQUEST_ERROR_OTHER_FIX = 12; // The request named a place found that is not the current one.
}

// Where the SLAM's orientation comes from.
enum SlamOrientationSource {
  SLAM_ORIENTATION_SOURCE_UNSPECIFIED = 0; // None: the scans are matched without an orientation.
  SLAM_ORIENTATION_SOURCE_SENSOR_IMU = 1; // The sensor's own IMU.
  SLAM_ORIENTATION_SOURCE_DRONE_ATTITUDE = 2; // The drone's attitude, its heading from the compass.
  // The drone's attitude for roll and pitch, its turn from the drone's calibrated gyro (not the compass).
  SLAM_ORIENTATION_SOURCE_DRONE_GYRO = 3;
  // The drone's attitude for roll and pitch, its heading the one the drone's position estimate keeps (its
  // navigation's: from a gyro, a DVL or the compass, as the drone has them).
  SLAM_ORIENTATION_SOURCE_DRONE_ESTIMATE = 4;
}

// What other than its sensors the SLAM's estimate rests on now.
message SlamAiding {
  SlamOrientationSource orientation = 1; // Where the orientation comes from.
  bool depth = 2; // True if a depth is used (from the drone's depth sensor).
  bool velocity = 3; // True if a velocity over the ground is used (a DVL with bottom lock).
}

// What the x axis of a SLAM map's frame points along.
enum SlamHeadingReference {
  SLAM_HEADING_REFERENCE_UNSPECIFIED = 0; // Not known.
  // The platform's heading at the map's first scan; without gravity alignment, the
  // platform's frame at the first scan as it is.
  SLAM_HEADING_REFERENCE_FIRST_SCAN = 1;
  // North, as the drone's compass heading (AttitudeTel yaw) gave it at the map's first scan.
  SLAM_HEADING_REFERENCE_DRONE_COMPASS = 2;
}

// What placed a SLAM map on the Earth.
enum SlamGeoreferenceSource {
  SLAM_GEOREFERENCE_SOURCE_UNSPECIFIED = 0; // Unspecified.
  SLAM_GEOREFERENCE_SOURCE_GNSS = 1; // The drone's GNSS receiver (the Blueye GNSS), from its fixes at the surface.
}

// Where a SLAM map lies on the Earth, as position fixes placed it: a point of the map, where it lies, and the
// bearing of the map's x axis.
//
// The fixes do not bend the map: it moves and turns as a whole. A point (x, y) of the map lies
// R(bearing) (x - anchor_x, y - anchor_y) north and east of anchor_position, where R turns north towards east
// (clockwise seen from above): with bearing 0, x is north and y east. The bearing is known only once fixes from
// places far enough apart pin it (bearing_known). Until then it is the map's own, as the drone's heading gave it at
// the map's first scan, which near steel can be far off; anchor_position holds whatever the bearing.
message SlamGeoreference {
  SlamGeoreferenceSource source = 1; // What placed the map.
  float anchor_x = 2; // x of the map point the fixes place (m, in the map frame): where they were taken, weighted.
  float anchor_y = 3; // y of the map point the fixes place (m, in the map frame).
  LatLongPosition anchor_position = 4; // Where the anchor lies (WGS84).
  float anchor_stddev = 5; // Standard deviation of the anchor's position (m), along its least sure direction.
  float bearing = 6; // Bearing of the map's x axis from true north (°, clockwise, 0 to 360).
  // Standard deviation of the bearing as the fixes give it (°). While bearing_known is false, it is how unsure the
  // fixes so far leave the bearing, up to 180° (fixes from one place say nothing of it); it is not the uncertainty
  // of bearing, which is then the map's own (from the drone's heading), and a client does not draw it as one.
  float bearing_stddev = 7;
  bool bearing_known = 8; // True if fixes pin the bearing; false: the map's own (the drone's heading at its start).
  LatLongPosition origin_position = 9; // Where the map's origin lies, at that bearing.
  // Standard deviation of the origin's position (m). With the bearing unknown, the anchor's plus the origin's
  // distance from it: any bearing may hold.
  float origin_stddev = 10;
  uint32 places = 11; // Places the fixes were taken at (surfacings, each counted as one position).
  uint32 fixes = 12; // Fixes used.
  google.protobuf.Timestamp last_fix_time = 13; // Host time of the newest fix used.
}

// How a SLAM map's frame lies in the world, for placing the map on a chart.
//
// The frame is right-handed: x along the heading reference, y to its right, z
// down (north-east-down with SLAM_HEADING_REFERENCE_DRONE_COMPASS). The origin is
// the platform's position at the map's first scan. The map's heading may drift
// from its reference over a dive: placing a map on a chart fits it to the drone's
// positions (PositionEstimateTel in the dive log), or takes georeference where
// position fixes have placed it.
message SlamMapFrame {
  bool gravity_aligned = 1; // True if z is down and x and y level; false: the first scan's platform frame.
  SlamHeadingReference heading_reference = 2; // What x points along.
  // The magnetic declination the drone applied to its compass heading at the
  // map's first scan (°, as MagneticDeclination.declination; 0 when it applied
  // none), with SLAM_HEADING_REFERENCE_DRONE_COMPASS: x then points the place's
  // declination less this east of true north (0 when the drone applied the
  // place's). Unset when not known.
  optional float magnetic_declination = 3;
  // Depth of the origin below the surface (m), for a gravity-aligned map: a point
  // at z in the map is at depth origin_depth + z. Unset without a depth.
  optional float origin_depth = 4;
  google.protobuf.Timestamp start_time = 5; // Host time of the map's first scan (its first keyframe's).
  SlamPlatform platform = 6; // What the map's poses are the poses of.
  // Where the map lies on the Earth, once position fixes have placed it (be-slam --gnss); unset without.
  SlamGeoreference georeference = 7;
}

// The whole SLAM map, or a part of it.
//
// A large map comes in parts (part_count of them, in order), each a message of
// its own. Every part has the map's map_id, sequence and part_count, and its own
// part: a client groups parts by them, and drops a set whose parts disagree (one
// of another map or sequence, or missing). Every other field that is not repeated
// is set in the first part (part 0). A client has the map once it has every part,
// and puts them together field by field: every repeated field is the parts'
// concatenated in part order, and every other field is the first part's, whatever
// a later part has (proto3 does not tell a field set to its default from an unset
// one, so a client could not tell which part sets it).
// Which part carries which repeated values is up to the SLAM, but a submap is
// never split: each comes whole, in one part, with all its points or its raster.
message SlamMap {
  // Identifier of the map (0 when the SLAM has no map); a new one each time the map starts,
  // unique while the SLAM runs.
  uint32 map_id = 1;
  uint64 sequence = 2; // Sequence number of the last update the map includes (0 for none).
  repeated SlamKeyframe keyframes = 3; // Every keyframe, in id order.
  repeated SlamSubmap submaps = 4; // Submaps, with all they hold.
  SlamMapFrame frame = 5; // How the map's frame lies in the world (unset before the first scan).
  repeated SlamLoopClosure loop_closures = 6; // Every loop closure, in the order they were made.
  uint32 part = 7; // Index of this part, from 0.
  uint32 part_count = 8; // Parts the map comes in (0 or 1: this message is the whole map).
}

// The latest scan of a sensor, as the SLAM placed it.
message SlamScan {
  uint32 map_id = 1; // Identifier of the map.
  SlamPose pose = 2; // Pose of the platform at the scan.
  PointCloud points = 3; // Points of the scan in the sensor frame: in the map at pose times mount.
  SlamSensor sensor = 4; // Sensor the scan comes from.
  // The sensor's pose on the platform at the scan. Unset when the platform is the sensor.
  SlamPose mount = 5;
  google.protobuf.Timestamp time = 6; // Host time the scan was received (as SlamPoseEstimate.time).
}

// A saved map, in brief: the first record of a map file
// (<recording>_map.sbez: this, then the map as SlamMapTel parts, its rasters
// deflated), so that a client lists maps and shows them small without
// reading them whole. The SLAM writes one beside each of its recordings; a
// client makes one of a recording it has (a file on the pilot's device) and
// puts it in the drone's media folder, where the SLAM loads it as its own.
message SlamMapSummary {
  string recording = 1; // File name of the recording the map ends (.sbez), without its folder.
  uint32 map_id = 2; // The map's id in that recording.
  SlamMapFrame frame = 3; // How the map's frame lies in the world; start_time is its first scan's.
  google.protobuf.Timestamp end_time = 4; // Host time of the map's last scan.
  SlamSensorType sensor_type = 5; // Kind of sensor that made the map.
  uint32 keyframe_count = 6; // Keyframes in the map.
  // What the map's content covers in its frame (m), along x and along y.
  float min_x = 7;
  float max_x = 8;
  float min_y = 9;
  float max_y = 10;
  string log_name = 11; // The dive log the recording belongs with (DroneInfo.log_name), when known.
  // The map's mosaic, coarse (at most 256 pixels a side), its origin in the map's frame: for a list to show. Unset
  // when the client that made the file did not draw one. A client's file (uploaded) may break the bound, so a
  // reader checks it and treats a larger preview as absent.
  SlamRaster preview = 12;
  bool uploaded = 13; // Made by a client from a recording it had, not by the SLAM beside its own.
  // Where the drone was at the map's first scan, as its own position estimate had it
  // (PositionEstimate.global_position), or else where it was when the estimate was first valid
  // after that: a rough place of the map on the Earth, for a list to tell the maps nearby.
  // Unset when the estimate was not valid while the map was made.
  LatLongPosition start_position = 14;
}

// Where finding the SLAM's map in a base map stands. A base map is a map
// saved earlier (a recording's, or a file a client uploaded), loaded so that
// the SLAM finds where its own map lies in it: it searches the base map for
// what it swept lately, and once found, ties its map to the base map with
// each later match.
enum SlamBaseMapStage {
  SLAM_BASE_MAP_STAGE_UNSPECIFIED = 0; // No base map.
  SLAM_BASE_MAP_STAGE_LOADING = 1; // Being read; a recording without its map file takes longest.
  SLAM_BASE_MAP_STAGE_SWEEPING = 2; // Loaded; too little swept yet to search with (progress).
  SLAM_BASE_MAP_STAGE_SEARCHING = 3; // Searched, no place taken yet (miss says why).
  SLAM_BASE_MAP_STAGE_CANDIDATE = 4; // A place passed one search; the next must agree before it is taken.
  SLAM_BASE_MAP_STAGE_FOUND = 5; // Found: base_map_pose is known, and each later match keeps it.
  SLAM_BASE_MAP_STAGE_FAILED = 6; // It could not be loaded (error); the SLAM maps without it.
}

// Why the last search of a base map took no place.
enum SlamBaseMapMiss {
  SLAM_BASE_MAP_MISS_UNSPECIFIED = 0; // None: a place was taken, or nothing searched yet.
  SLAM_BASE_MAP_MISS_NO_MATCH = 1; // Nothing scored: what was swept matched nothing in the base map.
  SLAM_BASE_MAP_MISS_OFF_MAP = 2; // Too little of what was swept lies on the base map: the drone may be off it.
  SLAM_BASE_MAP_MISS_AMBIGUOUS = 3; // Another place scores nearly as well: places that look alike.
  SLAM_BASE_MAP_MISS_REJECTED = 4; // Only places a client rejected scored (SlamBaseMapReject).
  SLAM_BASE_MAP_MISS_WEAK = 5; // Found before; near there this search scored too low (the drone may be off it).
  // A place outside the hint scored better than any in it, by the margin a place needs: the hint was dropped.
  SLAM_BASE_MAP_MISS_OUTSIDE_HINT = 6;
}

// What a client may ask of the base map (SetSlamBaseMapReq's actions).
enum SlamBaseMapAction {
  SLAM_BASE_MAP_ACTION_UNSPECIFIED = 0; // None.
  SLAM_BASE_MAP_ACTION_LOAD = 1; // SlamBaseMapLoad.
  SLAM_BASE_MAP_ACTION_CLEAR = 2; // SlamBaseMapClear.
  SLAM_BASE_MAP_ACTION_REJECT = 3; // SlamBaseMapReject.
  SLAM_BASE_MAP_ACTION_HINT = 4; // SlamBaseMapHint.
}

// The SLAM's base map, and where finding its map in it stands
// (SlamStatusTel.base_map, SetSlamBaseMapRep). Set only by a SLAM that can
// localize in a base map: unset, a client offers none.
message SlamBaseMapState {
  // One more at each change: of this and of a reply, the one with the higher revision is the newer. It starts at
  // the SLAM's start time (in milliseconds), so a SLAM started again is newer still.
  uint64 revision = 1;
  repeated SlamBaseMapAction actions = 2; // What this SLAM takes; a client offers no other.
  SlamBaseMapStage stage = 3; // Where it stands.
  string name = 4; // The base map's file (.sbez) in the drone's media folder, without the folder.
  StorageLocation storage_location = 5; // Where the file is.
  // The load, a new one each time a base map is loaded (0: none yet). A Clear keeps it: a Clear naming it again is
  // taken, and a Hint after it is refused with SLAM_REQUEST_ERROR_NO_BASE_MAP, whatever load it names.
  uint32 load_id = 6;
  // Which map the file holds (SlamMapSummary): its id in its recording, and its first scan's time. A client draws
  // the file it read only when they agree.
  uint32 base_map_id = 7;
  google.protobuf.Timestamp base_map_start_time = 8;
  float progress = 9; // SWEEPING: how much of the sweep a search needs is there, from 0 to 1.
  SlamBaseMapMiss miss = 10; // SEARCHING: why the last search took no place.
  uint32 map_id = 11; // The SLAM map base_map_pose is in (SlamPoseEstimate.map_id).
  // FOUND: the base map's frame in that map's frame, as the SLAM's back end has it: a point p of the base map is
  // at base_map_pose times p in the map.
  SlamPose base_map_pose = 12;
  // The place found (FOUND), or passed (CANDIDATE): a new one each, for SlamBaseMapReject. An id is never
  // repeated while the SLAM runs, whatever base maps it loads.
  uint32 fix_id = 13;
  uint32 matches = 14; // FOUND: the matches that keep it.
  google.protobuf.Timestamp last_match_time = 15; // FOUND: host time of the scan the last match was made at.
  // The last search's best place: its score (from 0, nothing alike, to 1), how far it stands above the next
  // place's (margin), and the share of the sweep that lies on the base map there (overlap). A place is taken
  // only with the margin and the overlap the SLAM requires.
  float score = 16;
  float margin = 17;
  float overlap = 18;
  bool hinted = 19; // The searches look where a hint says (SlamBaseMapHint).
  SlamRequestError error = 20; // FAILED: why.
}

// Load a base map (SetSlamBaseMapReq): a file in the drone's media folder,
// in place of any loaded before. The reply comes at once; the status follows
// the load (LOADING, then SWEEPING or FAILED). A map of this dive is searched
// in a window around its heading (both maps are north up, by a compass that
// drifts a few degrees between them); one of another dive at every heading.
message SlamBaseMapLoad {
  string name = 1; // The file (.sbez), without a folder: a recording, or its map file (<recording>_map.sbez).
  StorageLocation storage_location = 2; // Where it is.
}

// Take the base map away (SetSlamBaseMapReq): the map goes back to where its
// own scans put it.
message SlamBaseMapClear {
  // The load to clear. It must be the current one (SlamBaseMapState.load_id), else the request is refused with
  // SLAM_REQUEST_ERROR_OTHER_BASE_MAP. 0 is the current one only before any base map was loaded: once one was,
  // a clear with 0 is refused.
  uint32 load_id = 1;
}

// The place found (or passed) is wrong (SetSlamBaseMapReq): it is dropped,
// the map goes back to where its own scans put it, and the search goes on
// without that place or one near it.
message SlamBaseMapReject {
  // The place (SlamBaseMapState.fix_id): only if it is still the current one. A fix id is never repeated while
  // the SLAM runs, so a late reject drops no place found since, in this load or another.
  uint32 fix_id = 1;
}

// Where the drone is in the base map, roughly (SetSlamBaseMapReq): until
// found, a place is taken only within radius of it, and only while no place
// outside scores better by the margin a place needs (else the hint is
// dropped: SLAM_BASE_MAP_MISS_OUTSIDE_HINT). Radius 0 drops the hint.
message SlamBaseMapHint {
  // The load it is for. It must be the current one (SlamBaseMapState.load_id), else the request is refused with
  // SLAM_REQUEST_ERROR_OTHER_BASE_MAP; once a base map was loaded, a hint with 0 is refused. A hint also needs a
  // base map loaded, else SLAM_REQUEST_ERROR_NO_BASE_MAP.
  uint32 load_id = 1;
  Vector3 position = 2; // The drone's position in the base map's frame (m; z is not used).
  float radius = 3; // How far from position it may be (m).
}

