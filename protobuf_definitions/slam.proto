// SLAM
//
// The SLAM's (simultaneous localization and mapping) state, poses, map and
// sensors: what its telemetry (Slam*Tel in telemetry.proto) and its requests
// (in req_rep.proto) carry.
//
// The SLAM has its own publisher, not the drone's telemetry socket: a client
// subscribes to it on the drone at TCP port 5561 (WebSocket 9989) to get the
// Slam*Tel messages. Its requests (GetSlamMapReq, ResetSlamReq,
// SetSlamActiveReq, SetSlamSensorSettingsReq, SetSlamRecordingReq) go to the
// drone's request server as other requests do, which forwards them to the
// SLAM's (TCP 5562, WebSocket 9990).
syntax = "proto3";

package blueye.protocol;
import "google/protobuf/timestamp.proto";
import "message_formats.proto";
option csharp_namespace = "Blueye.Protocol.Protobuf";
option java_multiple_files = true;

// State of the SLAM (simultaneous localization and mapping).
enum SlamState {
  SLAM_STATE_UNSPECIFIED = 0; // Unspecified.
  SLAM_STATE_WAITING = 1; // Waiting for the first scan and orientation.
  SLAM_STATE_TRACKING = 2; // The latest scan was matched against the map.
  SLAM_STATE_COASTING = 3; // The latest scan could not be matched; the pose follows the motion model.
  // Coasting long enough that the prediction may be far off: a scan is placed again only by a match
  // that fixes the pose firmly.
  SLAM_STATE_LOST = 4;
}

// Kind of sensor a SLAM scan comes from.
enum SlamSensorType {
  SLAM_SENSOR_TYPE_UNSPECIFIED = 0; // Unspecified.
  SLAM_SENSOR_TYPE_SONAR_3D = 1; // A 3D imaging sonar, e.g. the Water Linked Sonar 3D-15.
  SLAM_SENSOR_TYPE_STEREO_CAMERA = 2; // A stereo camera's depth.
}

// What the SLAM's poses are the poses of: its platform.
enum SlamPlatform {
  SLAM_PLATFORM_UNSPECIFIED = 0; // Not known.
  // The drone, its body frame x forward, y right, z down from the middle of the hull. Each
  // sensor is on it through its mount (SlamPose mount in the messages that carry one).
  SLAM_PLATFORM_DRONE = 1;
  // The sensor itself: the SLAM did not know how the sensor is mounted.
  SLAM_PLATFORM_SENSOR = 2;
}

// A sensor whose scans feed the SLAM, and its field of view.
message SlamSensor {
  // Sensor id, unique among the SLAM's sensors. A sensor keeps the id it was given for as long as it
  // is connected, whatever other sensors connect or disconnect: the model's (e.g.
  // "waterlinked-sonar-3d15") when no other sensor of that model is connected, and else the model's with
  // the guest port the sensor is on added (e.g. "waterlinked-sonar-3d15-gp2").
  string id = 1;
  SlamSensorType sensor_type = 2; // Kind of sensor.
  float fov_horizontal = 3; // Horizontal field of view, about the sensor's z axis (°).
  float fov_vertical = 4; // Vertical field of view, about the sensor's y axis (°).
  float max_range = 5; // Range the sensor is set to (m).
  // The sensor as a guest port device (e.g. GUEST_PORT_DEVICE_ID_WATERLINKED_SONAR_3D15), for a client
  // to show the device itself; GUEST_PORT_DEVICE_ID_UNSPECIFIED when it is not one (a simulated sensor).
  GuestPortDeviceID device_id = 6;
  bool simulated = 7; // True if the sensor is simulated (its scans are made up, for testing).
}

// A recording of the SLAM, as the SLAM reports it.
//
// A recording is a .sbez file (a binlog) with the SLAM's output: the map at its
// start, then the poses, the map updates and the status. It may hold several maps
// (a reset, or a new mode, starts one), and each map it holds ends with the whole
// map (SlamMapTel, in parts when it is large). With sensor data it also has the
// sensor's raw data beside it (for a 3D sonar a .sonar file), and the drone's dive
// log logs its telemetry at higher rates while it runs, so the SLAM can be run
// again on both without the drone.
message SlamRecordingState {
  bool is_recording = 1; // True while recording.
  string name = 2; // File name of the .sbez, without its folder.
  int32 seconds = 3; // Time recorded (s).
  uint64 size = 4; // Size of the recording's files so far (bytes).
  bool sensor_data = 5; // True if the sensor's raw data is recorded too.
  StorageLocation storage_location = 6; // Where the recording is stored.
}

// SONAR_3D reads better than protolint's SONAR3D for Sonar3d.
// protolint:disable ENUM_FIELD_NAMES_PREFIX

// Frequency mode of a 3D imaging sonar.
enum Sonar3dFrequencyMode {
  SONAR_3D_FREQUENCY_MODE_UNSPECIFIED = 0; // Unspecified: left as it is.
  SONAR_3D_FREQUENCY_MODE_LOW = 1; // Wide view, long range (3D-15: 90° x 40°, 15 m, 5 scans/s).
  SONAR_3D_FREQUENCY_MODE_HIGH = 2; // Narrow view, short range, fine detail (3D-15: 40° x 40°, 4 m, 20 scans/s).
}

// protolint:enable ENUM_FIELD_NAMES_PREFIX

// Settings of a 3D imaging sonar that feeds the SLAM.
//
// In a request, unspecified or 0 leaves a setting as it is; in a report, it
// means the sonar does not say (e.g. a firmware without frequency modes).
message SlamSonar3dSettings {
  Sonar3dFrequencyMode frequency_mode = 1; // Frequency mode.
  float max_range = 2; // Maximum range (m).
}

// Settings of a sensor that feeds the SLAM.
//
// One message for each kind of sensor, so a client shows the settings of the
// sensors the SLAM has, and a sensor takes only its own.
message SlamSensorSettings {
  oneof settings {
    SlamSonar3dSettings sonar_3d = 1; // A 3D imaging sonar's settings.
  }
}

// A sensor that feeds the SLAM, as the SLAM reports it.
message SlamSensorStatus {
  // The sensor, as its latest scan described it (before its first scan, its id and type only).
  SlamSensor sensor = 1;
  SlamSensorSettings settings = 2; // The sensor's settings, unset when it has none or they cannot be read.
  // The sensor's pose on the platform now: its mount, at the mount's tilt now. Unset when the
  // platform is the sensor.
  SlamPose mount = 3;
  optional float mount_tilt = 4; // Tilt of the sensor's mount (°, positive up), for a mount that tilts.
}

// A pose: of a body in the SLAM map frame, or of a sensor on the platform.
//
// The map frame is fixed where the map was started (see SlamMapFrame): z down, x
// along the heading the map started with (north when a compass heading was used),
// y to the right of it, in metres. The body is the one the field names (the
// platform, or a sensor), its frame x forward, y right, z down. A mount is a
// sensor's pose in the platform's frame instead: the sensor is in the map at the
// platform's pose times its mount.
message SlamPose {
  Vector3 position = 1; // Position of the body (m).
  Quaternion orientation = 2; // Rotation from the body's frame to the frame it is placed in.
}

// The SLAM estimate of its platform's pose, published for every scan.
message SlamPoseEstimate {
  uint32 map_id = 1; // Identifier of the map; a new one is chosen whenever the map restarts.
  SlamState state = 2; // State of the SLAM.
  SlamPose pose = 3; // Pose of the platform (SlamMapFrame.platform) at the scan.
  google.protobuf.Timestamp time = 4; // Host time the scan was received.
  uint32 scan_points = 5; // Points (or cells) of the scan used for matching.
  float match_inlier_ratio = 6; // Share of those matched to the map (0..1).
  // Root mean square residual of the matched points against the map (m); for a 3D sonar, their distance to the
  // map's planes.
  float match_rms = 7;
  uint32 keyframe_count = 8; // Keyframes in the map.
  uint32 map_point_count = 9; // Points (or cells) in the map.
  // Depth used for the scan (m), when there was one: the sensor's, from the drone's depth sensor
  // through the mount (without a mount, the depth sensor's own).
  optional float depth = 10;
  string sensor_id = 11; // Sensor whose scan was placed (SlamSensor.id).
  // The sensor's pose on the platform at the scan: the sensor was at pose times mount.
  // Unset when the platform is the sensor.
  SlamPose mount = 12;
  // Covariance of pose as the scan's match placed it against the map, given the
  // prediction: 6 x 6, row by row, of a rotation about the map's x, y and z axes
  // (rad) and then a position along them (m). It says how well this scan fixed the
  // pose, not how far the map has drifted. Empty when the match gave none: the scan was not matched,
  // the map's first scan (nothing to match it against), or a fit whose covariance was not finite.
  repeated float covariance_elements = 13;
  // The newest keyframe when the scan was placed (SlamKeyframe.id), 0 before the map's first. A client
  // keeping poses can move one with that keyframe when a loop closure moves it: the pose becomes the
  // keyframe's new pose times its pose then, inverted, times the pose.
  uint32 keyframe_id = 14;
}

// A keyframe: a scan kept in the map, the nodes of the SLAM trajectory.
message SlamKeyframe {
  uint32 id = 1; // Keyframe id, increasing along the trajectory.
  uint32 submap_id = 2; // Submap whose points the keyframe added to.
  // Pose of the platform at the keyframe. It moves when the trajectory is corrected.
  SlamPose pose = 3;
  google.protobuf.Timestamp time = 4; // Host time the keyframe's scan was received.
  string sensor_id = 5; // Sensor whose scan the keyframe is (SlamSensor.id).
  // The sensor's pose on the platform at the keyframe. Unset when the platform is the sensor.
  SlamPose mount = 6;
}

// A submap: part of the map from one sensor, in the platform's frame at its anchor
// keyframe.
//
// A submap moves rigidly with its anchor keyframe, so a correction of the
// trajectory moves its content without sending it again. A submap holds one kind
// of content: points today; other kinds (e.g. a 2D sonar's mosaic) will be added
// to the oneof, each saying how a later one replaces what the submap holds.
message SlamSubmap {
  uint32 submap_id = 1; // Submap id.
  uint32 anchor_keyframe_id = 2; // Keyframe whose platform frame the content is in.
  string sensor_id = 3; // Sensor the content comes from (SlamSensor.id).
  oneof content {
    // Points in the platform's frame at the anchor keyframe. In a map update they are appended to the
    // submap's points, unless replace is set.
    PointCloud points = 4;
  }
  bool replace = 5; // Points: true if they replace the submap's points so far, rather than adding to them.
}

// Poses of consecutive keyframes, packed: what a correction of the trajectory
// moved, sent without the rest of each keyframe.
message SlamKeyframePoses {
  uint32 first_keyframe_id = 1; // Keyframe id of the first pose; the others follow it in id order.
  // Platform poses as in SlamKeyframe.pose, 7 little-endian float32 each: x, y, z (m), then the
  // orientation's x, y, z, w. 28 bytes per keyframe.
  bytes poses = 2;
}

// A loop closure: a keyframe's scan matched to the map where the trajectory had
// been before, which corrected the trajectory. The keyframes the correction moved
// come in the same update, so a client that held the map before has the
// trajectory as it was.
message SlamLoopClosure {
  uint32 keyframe_id = 1; // Keyframe whose scan closed the loop.
  uint32 matched_keyframe_id = 2; // Earlier keyframe it was matched near.
  // How far the correction moved the newest keyframe it reached (m): the loop's keyframe, or one
  // added while the loop was being closed.
  float position_correction = 3;
  // How far it turned that keyframe about the map's z axis (°, positive clockwise seen from
  // above in a gravity-aligned map).
  float heading_correction = 4;
}

// A change to the SLAM map.
//
// Updates are numbered: a client that has the map at sequence N applies the
// update with sequence N + 1 next. When it misses one, or the map id changes, it
// asks to catch up (GetSlamMapReq): it gets the updates it missed again, or the
// whole map.
message SlamMapUpdate {
  uint32 map_id = 1; // Identifier of the map.
  uint64 sequence = 2; // Sequence number of this update, from 1.
  repeated SlamKeyframe keyframes = 3; // Keyframes added.
  repeated SlamSubmap submaps = 4; // Content added to submaps, or replacing a submap's (SlamSubmap.replace).
  // The map's frame, on the update that adds the first keyframe and on any that
  // learns more of it: a recording cut short has it without its last SlamMapTel.
  SlamMapFrame frame = 5;
  repeated SlamLoopClosure loop_closures = 6; // Loop closures whose correction moved the keyframes.
  repeated SlamKeyframePoses moved_poses = 7; // New poses of the keyframes a correction moved, in runs.
  repeated uint32 removed_submap_ids = 8; // Submaps taken out of the map, with whatever they hold.
}

// Why the SLAM did not do what a request asked (the reply says what it did do).
enum SlamRequestError {
  SLAM_REQUEST_ERROR_UNSPECIFIED = 0; // None: the request was done, or asked for what already was.
  SLAM_REQUEST_ERROR_NOT_READABLE = 1; // The request could not be read.
  SLAM_REQUEST_ERROR_OTHER_MAP = 2; // The request named a map that is not the current one.
  // The request named a sensor the SLAM does not have, or named none where it has several that fit.
  SLAM_REQUEST_ERROR_NO_SUCH_SENSOR = 3;
  SLAM_REQUEST_ERROR_SENSOR = 4; // The sensor did not take it (it did not answer, or refused).
  SLAM_REQUEST_ERROR_BUSY = 5; // Another change to the sensor is under way; ask again after it.
  SLAM_REQUEST_ERROR_NOT_MAPPING = 6; // It needs the SLAM to be mapping (a recording).
  SLAM_REQUEST_ERROR_STORAGE = 7; // No storage to record to, or it is full.
  SLAM_REQUEST_ERROR_NOT_SUPPORTED = 8; // The SLAM or its sensor cannot do it.
}

// Where the SLAM's orientation comes from.
enum SlamOrientationSource {
  SLAM_ORIENTATION_SOURCE_UNSPECIFIED = 0; // None: the scans are matched without an orientation.
  SLAM_ORIENTATION_SOURCE_SENSOR_IMU = 1; // The sensor's own IMU.
  SLAM_ORIENTATION_SOURCE_DRONE_ATTITUDE = 2; // The drone's attitude, its heading from the compass.
  // The drone's attitude for roll and pitch, its turn from the drone's calibrated gyro (not the compass).
  SLAM_ORIENTATION_SOURCE_DRONE_GYRO = 3;
}

// What other than its sensors the SLAM's estimate rests on now.
message SlamAiding {
  SlamOrientationSource orientation = 1; // Where the orientation comes from.
  bool depth = 2; // True if a depth is used (from the drone's depth sensor).
  bool velocity = 3; // True if a velocity over the ground is used (a DVL with bottom lock).
}

// What the x axis of a SLAM map's frame points along.
enum SlamHeadingReference {
  SLAM_HEADING_REFERENCE_UNSPECIFIED = 0; // Not known.
  // The platform's heading at the map's first scan; without gravity alignment, the
  // platform's frame at the first scan as it is.
  SLAM_HEADING_REFERENCE_FIRST_SCAN = 1;
  // North, as the drone's compass heading (AttitudeTel yaw) gave it at the map's first scan.
  SLAM_HEADING_REFERENCE_DRONE_COMPASS = 2;
}

// How a SLAM map's frame lies in the world, for placing the map on a chart.
//
// The frame is right-handed: x along the heading reference, y to its right, z
// down (north-east-down with SLAM_HEADING_REFERENCE_DRONE_COMPASS). The origin is
// the platform's position at the map's first scan. The map's heading may drift
// from its reference over a dive: placing a map on a chart fits it to the drone's
// positions (PositionEstimateTel in the dive log).
message SlamMapFrame {
  bool gravity_aligned = 1; // True if z is down and x and y level; false: the first scan's platform frame.
  SlamHeadingReference heading_reference = 2; // What x points along.
  // The magnetic declination the drone applied to its compass heading at the
  // map's first scan (°, as MagneticDeclination.declination; 0 when it applied
  // none), with SLAM_HEADING_REFERENCE_DRONE_COMPASS: x then points the place's
  // declination less this east of true north (0 when the drone applied the
  // place's). Unset when not known.
  optional float magnetic_declination = 3;
  // Depth of the origin below the surface (m), for a gravity-aligned map: a point
  // at z in the map is at depth origin_depth + z. Unset without a depth.
  optional float origin_depth = 4;
  google.protobuf.Timestamp start_time = 5; // Host time of the map's first scan (its first keyframe's).
  SlamPlatform platform = 6; // What the map's poses are the poses of.
}

// The whole SLAM map, or a part of it.
//
// A large map comes in parts (part_count of them, in order), each a message of
// its own. Every field that is not repeated is set in the first part (part 0); a
// later part may repeat those that identify the map (map_id, sequence, part_count),
// which match the first part's, and has its own part. A client has the map once it
// has every part, and puts them together field by field: every repeated field is
// the parts' concatenated in part order, and every other field is the first
// part's, whatever a later part has (proto3 does not tell a field set to its
// default from an unset one, so a client could not tell which part sets it).
// Which part carries which repeated values is up to the SLAM, but a submap is
// never split: each comes whole, in one part.
message SlamMap {
  // Identifier of the map (0 when the SLAM has no map); a new one each time the map starts,
  // unique while the SLAM runs.
  uint32 map_id = 1;
  uint64 sequence = 2; // Sequence number of the last update the map includes (0 for none).
  repeated SlamKeyframe keyframes = 3; // Every keyframe, in id order.
  repeated SlamSubmap submaps = 4; // Submaps, with all they hold.
  SlamMapFrame frame = 5; // How the map's frame lies in the world (unset before the first scan).
  repeated SlamLoopClosure loop_closures = 6; // Every loop closure, in the order they were made.
  uint32 part = 7; // Index of this part, from 0.
  uint32 part_count = 8; // Parts the map comes in (0 or 1: this message is the whole map).
}

// The latest scan of a sensor, as the SLAM placed it.
message SlamScan {
  uint32 map_id = 1; // Identifier of the map.
  SlamPose pose = 2; // Pose of the platform at the scan.
  PointCloud points = 3; // Points of the scan in the sensor frame: in the map at pose times mount.
  SlamSensor sensor = 4; // Sensor the scan comes from.
  // The sensor's pose on the platform at the scan. Unset when the platform is the sensor.
  SlamPose mount = 5;
  google.protobuf.Timestamp time = 6; // Host time the scan was received (as SlamPoseEstimate.time).
}
