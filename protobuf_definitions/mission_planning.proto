// Mission Planning Protocol.
//
// These messages are used to start a mission and to monitor the status of the mission.
syntax = "proto3";

package blueye.protocol;
import "google/protobuf/timestamp.proto";
import "message_formats.proto";
option csharp_namespace = "Blueye.Protocol.Protobuf";

// A list of waypoints describes a mission that the auto pilot can execute.
message Mission {
  uint32 id = 1; // Mission id, defined by the client.
  string name = 2; // Mission name provided from the app.
  repeated Instruction instructions = 3; // List of instructions in the mission.
  repeated PathSegment path_segments = 4; // Calculated path segments from the reference generator (optional).
  uint32 total_distance = 5; // Total distance of the mission (m) (optional).
  uint32 total_duration_time = 6; // Total duration time of the mission (s) (optional).
  float default_surge_speed = 7; // Default cruise speed of the mission (m/s) (optional).
  float default_heave_speed = 8; // Default heave speed of the mission (m/s) (optional).
  float default_circle_of_acceptance = 9; // Default circle of acceptance for waypoints (m) (optional).
  uint32 revision = 10; // Set by the drone, increases with every SetInstructionUpdateReq.
}

// A mission consists of one or multiple instructions. One instruction can be of different types.
message Instruction {
  uint32 id = 1;
  uint32 group_id = 2; // Group id used for polygons.
  bool pause_on_completion = 3; // Pause the mission after this instruction. RunMissionCtrl continues it.
  oneof command {
    WaypointCommand waypoint_command = 4; // Go to waypoint.
    DepthSetPointCommand depth_set_point_command = 5; // Go to depth.
    CameraCommand camera_command = 6; // Camera commands.
    ControlModeCommand control_mode_command = 7; // Set control modes.
    TiltMainCameraCommand tilt_main_camera_command = 8; // Set camera to angle x.
    TiltMultibeamCommand tilt_multibeam_command = 9; // Set multibeam tilt angle.
    WaitForCommand wait_for_command = 10; // Wait for x seconds.
    GoToSurfaceCommand go_to_surface_command = 11; // Go to surface.
    GoToSeabedCommand go_to_seabed_command = 12; // Go to seabed.
    GoToHomeCommand go_to_home_command = 13; // Go to home position.
    SurveyCommand survey_command = 14; // Execute a survey pattern over a polygon area.
    MultibeamRecordCommand multibeam_record_command = 15; // Start or stop multibeam recording.
    MultibeamDriverCommand multibeam_driver_command = 16; // Start or stop the multibeam driver.
    SetMultibeamConfigCommand set_multibeam_config_command = 17; // Change the multibeam configuration.
    SetLightsCommand set_lights_command = 18; // Set the main or guest port lights.
    SetLaserCommand set_laser_command = 19; // Set the laser.
    SetTiltStabilizationCommand set_tilt_stabilization_command = 20; // Enable or disable tilt stabilization.
    SetCvModelCommand set_cv_model_command = 21; // Start or stop a computer vision model.
    AnnotationCommand annotation_command = 22; // Record an annotation in the dive log.
    SetHeadingCommand set_heading_command = 23; // Turn to a heading and hold it.
    TransectCommand transect_command = 24; // Drive a straight line on a course for a distance.
    RelativeDepthCommand relative_depth_command = 25; // Change the depth by an amount.
    SetSpeedCommand set_speed_command = 26; // Change the cruise speed for the rest of the mission.
  }
}

// Depth set point is used to describe a depth set-point relative to the surface or the seabed.
message DepthSetPoint {
  float depth = 1; // Desired depth at the wp (m).
  float speed_to_depth = 2; // Desired speed to desired depth set point (m/s).
  DepthZeroReference depth_zero_reference = 3; // Used to distinguish desired altitude or depth.
}

// Depth zero reference from surface for depth, and seabed for altitude.
enum DepthZeroReference {
  DEPTH_ZERO_REFERENCE_UNSPECIFIED = 0;
  DEPTH_ZERO_REFERENCE_SURFACE = 1;
  DEPTH_ZERO_REFERENCE_SEABED = 2;
}

// Waypoints used to describe a path for the auto pilot.
message Waypoint {
  uint32 id = 1; // Waypoint id.
  string name = 2; // Waypoint name provided from the app.
  LatLongPosition global_position = 3; // Position if the waypoint (decimal degrees).
  float circle_of_acceptance = 4; // Radius of the acceptance circle around the waypoint (m).
  float speed_to_target = 5; // Desired speed over ground to waypoint (m/s).
  DepthSetPoint depth_set_point = 6; // Depth set point (optional).
}

// Control mode for the vertical axis of the drone.
enum ControlModeVertical {
  CONTROL_MODE_VERTICAL_UNSPECIFIED = 0; // Unspecified.
  CONTROL_MODE_VERTICAL_MANUAL = 1; // Manual control mode.
  CONTROL_MODE_VERTICAL_AUTO_DEPTH = 2; // Auto depth control mode.
  CONTROL_MODE_VERTICAL_AUTO_ALTITUDE = 3; // Auto altitude control mode.
}

// Control mode for the horizontal axis of the drone.
enum ControlModeHorizontal {
  CONTROL_MODE_HORIZONTAL_UNSPECIFIED = 0; // Unspecified.
  CONTROL_MODE_HORIZONTAL_MANUAL = 1; // Manual control mode.
  CONTROL_MODE_HORIZONTAL_AUTO_HEADING = 2; // Auto heading control mode.
  CONTROL_MODE_HORIZONTAL_STATION_KEEPING = 3; // Station keeping control mode.
  CONTROL_MODE_HORIZONTAL_WEATHER_VANING = 4; // Weather vaning control mode (station keeping into the current).
}

// A ControlModeCommand is used to set vertical and horizontal control mode during a mission.
message ControlModeCommand {
  ControlModeVertical control_mode_vertical = 5; // Desired control mode in heave.
  ControlModeHorizontal control_mode_horizontal = 6; // Desired control mode in surge and yaw.
}

// DetectionTrigger is satisfied by what the computer vision models see.
//
// The trigger is satisfied while at least one detection of the running models matches all of the
// filters below. The models have to be running; a trigger for a model that is not running is not
// satisfied and TriggerStatus reports sensor_unavailable.
message DetectionTrigger {
  reserved 6, 7, 8; // hold_ms, release_ms and cooldown_ms, which moved to MissionRule.
  reserved "hold_ms", "release_ms", "cooldown_ms";
  repeated string class_names = 1; // Any of these class names; empty matches every class.
  string model_name = 2; // Only detections from this model; empty matches every model.
  Camera camera = 3; // Only detections from this camera; unspecified matches every camera.
  float min_confidence = 4; // Detections below this confidence are ignored (0..1).
  float min_area_fraction = 5; // Least bounding box area over image area a detection must have (0..1).
}

// DepthTrigger is satisfied while the drone is between two depths below the surface.
//
// A depth with a tolerance is the two bounds around it: 9 and 11 for ten metres give or take a
// metre. Leaving max_depth at zero gives no upper bound, so a min_depth of 20 on its own is
// satisfied deeper than 20 m. The drone always measures its depth, so this trigger never reports
// sensor_unavailable.
message DepthTrigger {
  float min_depth = 1; // Shallowest depth that satisfies the trigger (m below the surface).
  float max_depth = 2; // Deepest depth that satisfies the trigger (m). Zero means no upper bound.
}

// AltitudeTrigger is satisfied while the drone is between two heights above the seabed.
//
// A height with a tolerance is the two bounds around it: 2.5 and 3.5 for three metres off the
// bottom give or take half a metre. Leaving max_altitude at zero gives no upper bound. The height
// comes from a DVL or an altimeter; with neither mounted, out of its range, or with a reading the
// drone does not trust, the trigger is simply not satisfied and TriggerStatus reports
// sensor_unavailable.
message AltitudeTrigger {
  float min_altitude = 1; // Lowest height above the seabed that satisfies the trigger (m).
  float max_altitude = 2; // Highest height that satisfies the trigger (m). Zero means no upper bound.
}

// LocationTrigger is satisfied while the drone is inside a circle around a position.
//
// Entering the circle makes the trigger satisfied and leaving it makes it unsatisfied, so a rule
// with one location trigger can start a recording in its enter instructions and stop it in its exit
// instructions. Any valid position estimate will do, whichever sensors it is built from; while the
// drone has none the trigger is simply not satisfied and TriggerStatus reports sensor_unavailable.
message LocationTrigger {
  LatLongPosition position = 1; // Centre of the circle (decimal degrees).
  float circle_of_acceptance = 2; // Radius of the circle around the position (m). Must be above zero.
}

// Trigger is one condition of a mission rule.
message Trigger {
  oneof condition {
    DetectionTrigger detection_trigger = 1; // Satisfied by a detection from a computer vision model.
    DepthTrigger depth_trigger = 2; // Satisfied at a depth below the surface.
    AltitudeTrigger altitude_trigger = 3; // Satisfied at a height above the seabed.
    LocationTrigger location_trigger = 4; // Satisfied inside a circle around a position.
  }
}

// Which condition a Trigger carries. The values are the field numbers of the Trigger oneof.
enum TriggerKind {
  TRIGGER_KIND_UNSPECIFIED = 0; // No condition is set.
  TRIGGER_KIND_DETECTION = 1; // A DetectionTrigger.
  TRIGGER_KIND_DEPTH = 2; // A DepthTrigger.
  TRIGGER_KIND_ALTITUDE = 3; // An AltitudeTrigger.
  TRIGGER_KIND_LOCATION = 4; // A LocationTrigger.
}

// MissionRule runs instructions when all of its triggers are satisfied at once and when they stop
// being so. A drone runs at most 16 rules with at most 8 triggers and 8 instructions per list. A
// rule with no triggers never fires. Instructions that move the drone (waypoint, go to home,
// transect, survey, depth set point, relative depth, go to surface or seabed, control mode, set
// heading) and waits are refused in rules; camera, tilt, lights, laser, multibeam, tilt
// stabilization, CV model, annotation and set speed are allowed.
message MissionRule {
  reserved 4; // The single detection_trigger, replaced by the triggers list.
  reserved "detection_trigger";
  uint32 id = 1; // Rule id, defined by the client. Must be greater than zero and unique.
  string name = 2; // Rule name, for the log and the app.
  bool disabled = 3; // A disabled rule never fires. Rules run unless this is set.
  repeated Instruction enter_instructions = 5; // Run when the rule fires.
  repeated Instruction exit_instructions = 6; // Run when the rule releases.
  repeated Trigger triggers = 7; // Conditions that must all be satisfied at once for the rule to fire.
  uint32 hold_ms = 8; // How long all the triggers must stay satisfied before the rule fires. At most an hour.
  uint32 release_ms = 9; // How long a trigger must stay unsatisfied before the rule releases. At most an hour.
  uint32 cooldown_ms = 10; // Time after a release before the rule can fire again. At most an hour.
}

// MissionRuleStatus is the state of one rule.
message MissionRuleStatus {
  uint32 id = 1; // Rule id.
  MissionRuleState state = 2; // What the rule is doing.
  uint32 episodes = 3; // Times the rule has fired since it was set.
  google.protobuf.Timestamp last_fired = 4; // When the rule last fired; unset before the first time.
  InstructionResultState last_result = 5; // Outcome of the last instruction the rule ran.
  string last_reason = 6; // Reason of the last result, when there is one.
  repeated TriggerStatus triggers = 7; // One entry per trigger, in the order the rule lists them.
}

// TriggerStatus is the state of one trigger of a rule, so a client can show which condition is
// holding the rule back.
message TriggerStatus {
  TriggerKind kind = 1; // Which condition the trigger carries.
  bool satisfied = 2; // True while the condition holds.
  bool sensor_unavailable = 3; // True while the drone has no reading to judge the condition by.
}

// InsertInstruction adds an instruction to the loaded mission.
message InsertInstruction {
  Instruction instruction = 1; // The instruction to add. Its id must be new to the mission.
  uint32 before_id = 2; // Id of the instruction to insert in front of, unless append is set.
  bool append = 3; // Add the instruction at the end of the mission.
}

// A WaypointCommand will request the drone to drive to a point automatically.
message WaypointCommand {
  Waypoint waypoint = 1; // Waypoint to go to.
}

// A DepthSetPointCommand is used to go to a desired depth or altitude.
message DepthSetPointCommand {
  DepthSetPoint depth_set_point = 1; // Depth set point to go to.
}

// The TiltMainCameraCommand can set the desired camera tilt angle.
message TiltMainCameraCommand {
  TiltAngle tilt_angle = 1; // Tilt angle of the camera (-30..30).
}

// The TiltMultibeamCommand is used to set the tilt angle of the servo.
message TiltMultibeamCommand {
  MultibeamServo multibeam_servo = 1; // Tilt angle for the multibeam servo.
}

// WaitForCommand is used to wait during a mission.
message WaitForCommand {
  float wait_for_seconds = 1; // Wait for x seconds.
}

// CameraCommands are used to control the camera from a mission.
message CameraCommand {
  CameraAction camera_action = 1; // Camera command.
  float action_param = 2; // Used for taking photos based on a time or distance interval.
  Camera camera = 3; // Which camera the action applies to. The main camera when unspecified.
  StorageLocation storage_location = 4; // Where to store the photos or the recording. Internal when unspecified.
}

// GoToSurfaceCommand is used to go to the surface.
message GoToSurfaceCommand {
  float desired_speed = 1; // Desired speed to surface (m/s).
}

// GoToSeabedCommand is used to go to the seabed.
message GoToSeabedCommand {
  float desired_speed = 1; // Desired speed to seabed (m/s).
}

// GoToHomeCommand is used to go to the home position.
message GoToHomeCommand {
  float desired_speed = 1; // Desired speed to home (m/s).
}

// MultibeamRecordCommand starts or stops recording of the multibeam sonar.
message MultibeamRecordCommand {
  bool enable = 1; // True to start recording, false to stop.
  StorageLocation storage_location = 2; // Where to store the recording. Internal when unspecified.
}

// MultibeamDriverCommand starts or stops the multibeam sonar driver.
//
// The instruction completes when the driver reports the requested state, so a following
// MultibeamRecordCommand or TiltMultibeamCommand finds the sonar ready.
message MultibeamDriverCommand {
  bool activate = 1; // True to start the driver, false to stop it.
  MultibeamConfig config = 2; // Configuration to start with. When left out, the last known configuration is used.
  // The sonar `config` was made for, as the multibeam driver reports it. The driver still starts or
  // stops when a different sonar is connected, but `config` is skipped and the drone sends a
  // NOTIFICATION_TYPE_MULTIBEAM_SONAR_MISMATCH notification. Unspecified applies `config` to
  // whichever sonar is connected.
  GuestPortDeviceID expected_device_id = 3;
}

// SetMultibeamConfigCommand changes the configuration of a running multibeam sonar.
//
// A configuration is made for one sonar, because ranges, frequencies and beam counts differ between
// them. The drone compares expected_device_id with the sonar the multibeam driver reports, not with
// what the guest port discovery found, and when they differ it skips the whole instruction and
// sends a NOTIFICATION_TYPE_MULTIBEAM_SONAR_MISMATCH notification; the mission carries on with the
// next instruction. Unspecified applies the configuration to whichever sonar is connected.
message SetMultibeamConfigCommand {
  MultibeamConfig config = 1; // The configuration to apply.
  GuestPortDeviceID expected_device_id = 2; // The sonar this configuration was made for.
}

// Which lights a SetLightsCommand applies to.
enum LightTarget {
  LIGHT_TARGET_UNSPECIFIED = 0; // Unspecified, treated as the main lights.
  LIGHT_TARGET_MAIN = 1; // The drone's own lights.
  LIGHT_TARGET_GUESTPORT = 2; // Lights connected to a guest port.
}

// SetLightsCommand sets the intensity of the lights.
message SetLightsCommand {
  float intensity = 1; // Light intensity (0..1).
  LightTarget target = 2; // Which lights to set.
}

// SetLaserCommand sets the laser connected to a guest port.
message SetLaserCommand {
  Laser laser = 1; // Laser intensity and modulation.
}

// SetTiltStabilizationCommand enables or disables camera tilt stabilization.
message SetTiltStabilizationCommand {
  bool enabled = 1; // True to stabilize the camera tilt.
}

// SetCvModelCommand starts or stops a computer vision model on the drone.
//
// The instruction completes when the model reports the requested state.
message SetCvModelCommand {
  string package_id = 1; // The model package to start or stop, as listed in CvModelInfo.
  bool running = 2; // True to start the model, false to stop it.
}

// AnnotationCommand records an annotation in the dive log, as AnnotationCtrl does.
message AnnotationCommand {
  Annotation annotation = 1; // The annotation to record. The drone sets the timestamp and the source.
}

// SetHeadingCommand turns the drone to a heading and holds it with auto heading.
message SetHeadingCommand {
  float heading = 1; // Target heading relative to north (deg, 0..360), or the turn when relative is set.
  bool relative = 2; // True to turn by `heading` degrees from the current heading; positive is clockwise.
}

// TransectCommand drives a straight line from the current position, like a waypoint the drone
// computes itself from a course and a distance.
message TransectCommand {
  float course = 1; // Course relative to north (deg, 0..360).
  float distance = 2; // Length of the line (m).
  float speed = 3; // Desired speed over ground (m/s). The mission default when 0.
  DepthSetPoint depth_set_point = 4; // Optional depth or altitude to hold along the line.
  float circle_of_acceptance = 5; // Radius of acceptance at the end of the line (m). The mission default when 0.
}

// RelativeDepthCommand changes the depth by an amount from where the drone is when it starts.
message RelativeDepthCommand {
  float depth_change = 1; // Change in depth (m); positive is deeper, negative shallower.
  float speed = 2; // Desired speed to the new depth (m/s). The mission default when 0.
}

// SetSpeedCommand changes the cruise speed used by the following instructions of the mission.
message SetSpeedCommand {
  float cruise_speed = 1; // Desired surge speed (m/s). Must be greater than zero.
}

// A SurveyCommand defines a survey (lawn-mower) pattern over a polygon area.
// The planner generates waypoints from the polygon + parameters and stores them
// in the waypoints field. The drone executes these pre-computed waypoints directly
// without re-running the survey algorithm. The polygon and parameters remain
// editable in the planner — regenerate waypoints when they change.
// Planners SHOULD validate that the polygon is simple (non-self-intersecting)
// before generating waypoints, as behavior is undefined for invalid polygons.
message SurveyCommand {
  // Polygon vertices defining the survey area boundary (decimal degrees).
  // The polygon is implicitly closed: the last vertex connects back to the first.
  // Clients MUST NOT repeat the first vertex at the end of the list.
  // Vertices should be ordered clockwise when viewed from above.
  // The boundary must form a simple polygon (no self-intersections).
  // At least three distinct vertices are required.
  repeated LatLongPosition vertices = 1;
  // Survey line heading relative to north in degrees (0-360).
  // NOTE: Unlike PathSegment.course_to_target (which uses radians), this field
  // uses degrees to match compass convention. Convert radians before assigning.
  float survey_line_heading = 2;
  float lane_spacing = 3; // Distance between parallel scan lines (m).
  float turnaround_distance = 4; // Overshoot distance past polygon boundary at each turn (m).
  float cruise_speed = 5; // Desired speed over ground during survey (m/s).
  float circle_of_acceptance = 6; // Radius of acceptance circle for generated waypoints (m).
  DepthSetPoint depth_set_point = 7; // Optional depth set point for all generated waypoints.
  bool reverse = 8; // If true, reverse the scan line order (swap start and end points).
  // Pre-computed waypoints generated by the planner from the polygon and parameters.
  // The drone executes these directly. Individual waypoint parameters (speed, CoA,
  // depth) can be tweaked after generation without modifying the survey shape.
  // Regenerated automatically when polygon or survey parameters change.
  repeated Waypoint waypoints = 9;
  float swath_width = 10; // Sensor swath width (m). When set with overlap_percent, overrides lane_spacing.
  float overlap_percent = 11; // Desired overlap between adjacent scan lines (0-100%). Used with swath_width.
}

// List of available camera actions.
enum CameraAction {
  CAMERA_ACTION_UNSPECIFIED = 0; // Unspecified command.
  CAMERA_ACTION_TAKE_PHOTO = 1; // Take one photo.
  CAMERA_ACTION_TAKE_PHOTOS_TIME = 2; // Take a photo every x second.
  CAMERA_ACTION_TAKE_PHOTOS_DISTANCE = 3; // Take a photo every x meter.
  CAMERA_ACTION_STOP_TAKING_PHOTOS = 4; // Stop taking photos.
  CAMERA_ACTION_START_RECORDING = 5; // Start recording.
  CAMERA_ACTION_STOP_RECORDING = 6; // Stop recording.
}

// Path segment used to describe segments of a mission as a line between to waypoints.
message PathSegment {
  uint32 id = 1; // Path segment id starting at 0, -1 for inactive.
  float speed_to_target = 2; // Desired speed over ground in (m/s).
  float course_to_target = 3; // Course to target relative to north (rad) [-pi, pi].
  float depth_speed = 4; // Desired speed in heave (m/s).
  float horizontal_length = 5; // Horizontal length of the path segment (m).
  float vertical_length = 6; // Vertical length of the path segment (m).
  uint32 from_wp_id = 7; // Id of the starting waypoint.
  uint32 to_wp_id = 8; // Id of the ending waypoint.
  float duration_time = 9; // Estimated time it takes to complete given length and desired speed (s).
}

// List of available instruction types.
enum InstructionType {
  INSTRUCTION_TYPE_UNSPECIFIED = 0; // Unspecified.
  INSTRUCTION_TYPE_NONE = 1; // None.
  INSTRUCTION_TYPE_GO_TO_WAYPOINT = 2; // Go to waypoint.
  INSTRUCTION_TYPE_GO_TO_WAYPOINT_WITH_DEPTH_SET_POINT = 3; // Go to waypoint with depth set point.
  INSTRUCTION_TYPE_GO_TO_DEPTH_SET_POINT = 4; // Go to depth set point.
  INSTRUCTION_TYPE_SET_CAMERA_ACTION = 5; // Command used to take photo repeatedly or start, stop recording.
  INSTRUCTION_TYPE_SET_CONTROL_MODE = 6; // Sets a new control mode.
  INSTRUCTION_TYPE_SET_TILT_MAIN_CAMERA = 7; // Sets a new angle for the tilt servo.
  INSTRUCTION_TYPE_SET_TILT_SERVO = 8; // Sets a new angle for the tilt servo.
  INSTRUCTION_TYPE_WAIT_FOR_SEC = 9; // Waiting for requested time in seconds.
  INSTRUCTION_TYPE_GO_TO_SURFACE = 10; // Go to the surface.
  INSTRUCTION_TYPE_GO_TO_SEABED = 11; // Go to the seabed.
  INSTRUCTION_TYPE_GO_TO_HOME = 12; // Returning to home.
  INSTRUCTION_TYPE_SURVEY = 13; // Execute a survey pattern over a polygon area.
  INSTRUCTION_TYPE_MULTIBEAM_RECORD = 14; // Start or stop multibeam recording.
  INSTRUCTION_TYPE_MULTIBEAM_DRIVER = 15; // Start or stop the multibeam driver.
  INSTRUCTION_TYPE_SET_MULTIBEAM_CONFIG = 16; // Change the multibeam configuration.
  INSTRUCTION_TYPE_SET_LIGHTS = 17; // Set the lights.
  INSTRUCTION_TYPE_SET_LASER = 18; // Set the laser.
  INSTRUCTION_TYPE_SET_TILT_STABILIZATION = 19; // Enable or disable tilt stabilization.
  INSTRUCTION_TYPE_SET_CV_MODEL = 20; // Start or stop a computer vision model.
  INSTRUCTION_TYPE_ANNOTATION = 21; // Record an annotation.
  INSTRUCTION_TYPE_SET_HEADING = 22; // Turn to a heading.
  INSTRUCTION_TYPE_TRANSECT = 23; // Drive a straight line.
  INSTRUCTION_TYPE_RELATIVE_DEPTH = 24; // Change the depth by an amount.
  INSTRUCTION_TYPE_SET_SPEED = 25; // Change the cruise speed.
}

// Reference for the auto pilot when a mission is active.
message ReferenceAutoPilot {
  InstructionType instruction_type = 1; // Instruction type.
  uint32 active_instruction_id = 2; // Id of the active instruction.
  uint32 active_path_segment_id = 3; // Id of the active path segment.
  float course_to_target = 4; // Course to the next waypoint from north (rad) [-pi, pi].
  float speed_over_ground = 5; // Desired speed over ground (m/s).
  float horizontal_distance_to_target = 6; // Horizontal distance to the next waypoint (m).
  float circle_of_acceptance = 7; // Circle of acceptance to mark waypoint as visited (m).
  float depth_set_point = 8; // Desired depth set point (m).
  float heave_velocity = 9; // Desired heave velocity (m/s).
  float vertical_distance_to_target = 10; // Vertical distance to the next waypoint (m).
  DepthZeroReference depth_zero_reference = 11; // Indicates if depth is measured from the surface or seabed.
  float time_to_complete = 12; // Estimated time to complete the instruction (s).
}

// List of mission supervisor states.
enum MissionState {
  MISSION_STATE_UNSPECIFIED = 0; // Unspecified.
  MISSION_STATE_INACTIVE = 1; // Mission supervisor is inactive.
  MISSION_STATE_READY = 2; // Ready to start mission.
  MISSION_STATE_RUNNING = 3; // Mission is running.
  MISSION_STATE_PAUSED = 4; // Mission is paused.
  MISSION_STATE_COMPLETED = 5; // Mission is completed.
  MISSION_STATE_ABORTED = 6; // Mission is aborted by the mission supervisor.
  MISSION_STATE_FAILED_TO_LOAD_MISSION = 7; // Mission has failed to load.
  MISSION_STATE_FAILED_TO_START_MISSION = 8; // Mission has failed to start.
}

// Mission Status is used for showing the status of the mission.
message MissionStatus {
  MissionState state = 1; // State of the mission supervisor.
  uint32 time_elapsed = 2; // Time elapsed since mission started (s).
  uint32 estimated_time_to_complete = 3; // Estimated time to complete the mission (s).
  uint32 distance_to_complete = 4; // Distance left of the mission (m).
  repeated uint32 completed_instruction_ids = 5; // Ids of the completed instructions.
  uint32 total_number_of_instructions = 6; // Total number of instructions in the mission.
  repeated uint32 completed_path_segment_ids = 7; // Ids of the completed path segments.
  uint32 total_number_of_path_segments = 8; // Total number of path segments in the mission.
  uint32 id = 9; // Mission id of the active mission.
  int32 active_instruction_id = 10; // Id of the instruction that is running, -1 when none.
  uint32 revision = 11; // Revision of the loaded mission, see Mission.revision.
  string failure_reason = 12; // Why the mission failed to load or start or was aborted by the drone.
}

// Outcome of an instruction started with RunInstructionCtrl.
enum InstructionResultState {
  INSTRUCTION_RESULT_STATE_UNSPECIFIED = 0; // Unspecified.
  INSTRUCTION_RESULT_STATE_ACCEPTED = 1; // The instruction was accepted and has started.
  INSTRUCTION_RESULT_STATE_REJECTED = 2; // The instruction was not started, see reason.
  INSTRUCTION_RESULT_STATE_COMPLETED = 3; // The instruction completed.
  INSTRUCTION_RESULT_STATE_FAILED = 4; // The instruction stopped before completing, see reason.
  INSTRUCTION_RESULT_STATE_CANCELLED = 5; // The instruction was cancelled by a client or by the drone.
}

// MissionRuleState is where a rule is in its episode.
enum MissionRuleState {
  MISSION_RULE_STATE_UNSPECIFIED = 0; // Unspecified.
  MISSION_RULE_STATE_IDLE = 1; // Waiting for the trigger.
  MISSION_RULE_STATE_ACTIVE = 2; // The rule has fired and has not released yet.
  MISSION_RULE_STATE_COOLDOWN = 3; // Released; waiting for the cooldown before it can fire again.
  MISSION_RULE_STATE_DISABLED = 4; // The rule is disabled.
}

// Result of an instruction started with RunInstructionCtrl.
message InstructionResult {
  uint32 request_id = 1; // The request_id given to RunInstructionCtrl.
  uint32 instruction_id = 2; // Id of the instruction, as given by the client.
  InstructionResultState state = 3; // Outcome so far.
  string reason = 4; // Why the instruction was rejected, failed or was cancelled (optional).
}
