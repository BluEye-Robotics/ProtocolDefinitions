# Keep this filename: its existing run counter supplies all package versions.
name: Protocol packages

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Test shared version rules
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Calculate the shared package version
        id: version
        run: echo "version=$(python3 scripts/package-version.py)" >> "$GITHUB_OUTPUT"

  nuget:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          source-url: https://nuget.pkg.github.com/BluEye-Robotics/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the NuGet package
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package-version }}
        run: dotnet pack Blueye.Protocol.Protobuf.csproj -p:Version="$PACKAGE_VERSION" -c Release -o out
      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && github.repository == 'BluEye-Robotics/ProtocolDefinitions'
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push ./out/*.nupkg --skip-duplicate --no-symbols \
            --source https://nuget.pkg.github.com/BluEye-Robotics/index.json --api-key "$NUGET_AUTH_TOKEN"

  kotlin:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-kotlin.yaml
    with:
      package-version: ${{ needs.version.outputs.package-version }}

  swift:
    needs: [version, nuget, kotlin]
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'BluEye-Robotics/ProtocolDefinitions' &&
      github.ref == 'refs/heads/master' &&
      vars.SWIFT_PROTOCOL_REPOSITORY != ''
    uses: ./.github/workflows/ci-swift.yaml
    with:
      package-version: ${{ needs.version.outputs.package-version }}
    secrets:
      CI_PAT: ${{ secrets.CI_PAT }}
