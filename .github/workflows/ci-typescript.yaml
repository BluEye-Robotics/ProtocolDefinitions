name: Compile TypeScript Protobuf Definitions

on:
  push:
    branches:
      - master

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          pnpm install

      - name: Generate
        run: pnpm run generate

      - name: Compile
        run: pnpm run build

      - name: Verify package entrypoints
        run: |
          SMOKE=$(mktemp -d)
          TARBALL=$(pnpm pack --pack-destination "$SMOKE" | tail -1)
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install "$TARBALL" > /dev/null
          node --input-type=module -e "
            import { blueye } from '@blueyerobotics/protocol-definitions';
            if (!blueye.protocol.GetBatteryReq) throw new Error('missing expected export');
            console.log('ESM import OK');
          "
          node --input-type=commonjs -e "
            const { blueye } = require('@blueyerobotics/protocol-definitions');
            if (!blueye.protocol.GetBatteryReq) throw new Error('missing expected export');
            console.log('CJS require OK');
          "

      - name: Publish to npm
        run: |
          cp README.npm.md README.md
          VERSION=$(pnpm pkg get version | tr -d '"')
          SHORT_SHA=${GITHUB_SHA::8}
          pnpm version --no-git-tag-version "${VERSION}-${SHORT_SHA}"
          pnpm publish --no-git-checks --access public --tag latest
